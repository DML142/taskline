version: "2"
sql:
  - engine: postgresql
    queries: queries
    schema: migrations
    gen:
      go:
        package: database
        out: internal/platform/database/sqlc
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
